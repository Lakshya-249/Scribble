services:
  scribble:
    build: .
    container_name: scribble
    ports:
      - "8005:8000"
    environment:
      # REQUIRED when hosted: the public host name(s), comma separated. Requests for any other Host are refused.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,scrible.slingshot.quest,www.scrible.slingshot.quest}
      # Set to 1 once the site is served over HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - MAX_SESSIONS=${MAX_SESSIONS:-50}
      - SESSION_TTL=${SESSION_TTL:-1800}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-60}
      # AGPL: link to the source of the version you run (shown in the footer).
      - SOURCE_URL=${SOURCE_URL:-}
    restart: unless-stopped
    mem_limit: 2g
