<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Surgeon — True Document Editor</title>
  <style>
    :root {
      --bg: #1e2227;
      --bar: #14171a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2e343b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      margin-right: 12px;
      color: #fff;
    }
    button, .btn-label {
      background: #262b31;
      color: var(--text);
      border: 1px solid #3a4149;
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover, .btn-label:hover { background: #323840; border-color: #4b5563; }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #status {
      margin-left: auto;
      font-size: 13px;
      color: var(--muted);
    }
    #workspace {
      flex: 1;
      padding: 28px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      overflow-y: auto;
    }
    .page-wrap {
      position: relative;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      user-select: none;
    }
    .page-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* Interactive hover box for each editable paragraph/word block */
    .text-box {
      position: absolute;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: text;
      transition: border-color 0.1s ease, background-color 0.1s ease;
    }
    .text-box:hover {
      border-color: rgba(37, 99, 235, 0.55);
      background: rgba(37, 99, 235, 0.04);
    }
    /* True WYSIWYG paper-matched editor overlay */
    .wysiwyg-editor {
      position: absolute;
      z-index: 50;
      background: #ffffff;
      color: #111827;
      border: 2px solid var(--accent);
      border-radius: 3px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.22);
      padding: 1px 2px;
      margin: -2px -3px;
      resize: both;
      overflow: hidden;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      box-sizing: content-box;
    }
    .editor-hint {
      position: absolute;
      z-index: 51;
      background: #1e293b;
      color: #f8fafc;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .cover-rect {
      position: absolute;
      border: 2px dashed #ef4444;
      background: rgba(239, 68, 68, 0.15);
      pointer-events: none;
    }
    .empty-state {
      margin-top: 12vh;
      text-align: center;
      color: var(--muted);
      max-width: 420px;
    }
    .empty-state h2 { color: var(--text); margin-bottom: 8px; font-size: 20px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">PDF Surgeon</span>
    <label class="btn-label primary">
      Open PDF
      <input type="file" id="fileInput" accept="application/pdf" hidden />
    </label>
    <button id="modeEdit" class="active" title="Click any text or paragraph to edit in-place">Edit Text</button>
    <button id="modeAdd" title="Click anywhere on the page to insert new text">Add Text</button>
    <button id="modeCover" title="Drag a box to erase text, borders, or images">Erase Box</button>
    <button id="btnUndo">Undo</button>
    <button id="btnSave">Download PDF</button>
    <span id="status">Ready — Open a PDF to start editing</span>
  </header>

  <main id="workspace">
    <div class="empty-state" id="emptyState">
      <h2>Open any PDF to edit</h2>
      <p>Click directly on paragraphs, bullet points, tables, or columns to edit them in-place like a Word document.</p>
    </div>
  </main>

  <script>
    const workspace = document.getElementById("workspace");
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("fileInput");
    const modeEditBtn = document.getElementById("modeEdit");
    const modeAddBtn = document.getElementById("modeAdd");
    const modeCoverBtn = document.getElementById("modeCover");
    const btnUndo = document.getElementById("btnUndo");
    const btnSave = document.getElementById("btnSave");

    let pagesMeta = [];
    let currentMode = "edit"; // "edit" | "add" | "cover"
    let activeEditor = null;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function setMode(mode) {
      currentMode = mode;
      modeEditBtn.classList.toggle("active", mode === "edit");
      modeAddBtn.classList.toggle("active", mode === "add");
      modeCoverBtn.classList.toggle("active", mode === "cover");
      closeActiveEditor(false);
    }

    modeEditBtn.onclick = () => setMode("edit");
    modeAddBtn.onclick = () => setMode("add");
    modeCoverBtn.onclick = () => setMode("cover");

    function cssFontFamily(pdfFontName, flags) {
      const n = (pdfFontName || "").toLowerCase();
      if ((flags & 8) || n.includes("cour") || n.includes("mono") || n.includes("consol")) {
        return '"Courier New", Courier, monospace';
      }
      if (n.includes("times") || n.includes("serif") || n.includes("georgia") || n.includes("cambria") || n.includes("roman")) {
        return '"Times New Roman", Times, Georgia, serif';
      }
      return ' Arial, Helvetica, "Liberation Sans", sans-serif';
    }

    function intToHexColor(c) {
      if (!c) return "#111827";
      const r = (c >> 16) & 255;
      const g = (c >> 8) & 255;
      const b = c & 255;
      return `rgb(${r}, ${g}, ${b})`;
    }

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await uploadPdf(file, "");
      fileInput.value = "";
    });

    async function uploadPdf(file, password = "") {
      setStatus("Opening PDF...");
      const buf = await file.arrayBuffer();
      const res = await fetch(`/open?password=${encodeURIComponent(password)}`, {
        method: "POST",
        body: buf,
      });
      const data = await res.json();
      if (res.status === 401 && data.detail === "password") {
        const pw = prompt("This PDF is password-protected. Enter password:");
        if (pw !== null) return uploadPdf(file, pw);
        setStatus("Cancelled.");
        return;
      }
      if (!res.ok) {
        alert(data.error || "Failed to open PDF");
        setStatus("Error opening PDF");
        return;
      }
      pagesMeta = data.pages || [];
      renderAllPages();
      setStatus(`Loaded ${pagesMeta.length} page(s). Click any paragraph to edit.`);
    }

    function renderAllPages() {
      workspace.innerHTML = "";
      pagesMeta.forEach((meta, idx) => {
        const wrap = document.createElement("div");
        wrap.className = "page-wrap";
        wrap.dataset.page = idx;
        const wPx = Math.round(meta.w * meta.z);
        const hPx = Math.round(meta.h * meta.z);
        wrap.style.width = wPx + "px";
        wrap.style.height = hPx + "px";

        const img = document.createElement("img");
        img.alt = `Page ${idx + 1}`;
        wrap.appendChild(img);

        setupPageInteractions(wrap, idx, meta);
        workspace.appendChild(wrap);
        refreshPage(idx);
      });
    }

    async function refreshPage(pageIdx) {
      const wrap = workspace.querySelector(`.page-wrap[data-page="${pageIdx}"]`);
      if (!wrap) return;
      const meta = pagesMeta[pageIdx];
      const img = wrap.querySelector("img");
      img.src = `/pageimg/${pageIdx}?t=${Date.now()}`;

      wrap.querySelectorAll(".text-box").forEach((el) => el.remove());

      const res = await fetch(`/text/${pageIdx}`);
      if (!res.ok) return;
      const blocks = await res.json();

      blocks.forEach((b) => {
        const [x0, y0, x1, y1] = b.dbox;
        const box = document.createElement("div");
        box.className = "text-box";
        box.style.left = (x0 * meta.z) + "px";
        box.style.top = (y0 * meta.z) + "px";
        box.style.width = Math.max(14, (x1 - x0) * meta.z) + "px";
        box.style.height = Math.max(12, (y1 - y0) * meta.z) + "px";

        box.addEventListener("click", (ev) => {
          if (currentMode !== "edit") return;
          ev.stopPropagation();
          openBlockEditor(wrap, pageIdx, meta, b);
        });

        wrap.appendChild(box);
      });
    }

    function closeActiveEditor(commit = true) {
      if (!activeEditor) return;
      const current = activeEditor;
      activeEditor = null;
      if (current.hintEl) current.hintEl.remove();
      const newVal = current.textarea.value;
      current.textarea.remove();
      if (commit && newVal !== current.block.text) {
        submitLineEdit(current.pageIdx, current.block, newVal);
      }
    }

    function openBlockEditor(wrap, pageIdx, meta, block) {
      closeActiveEditor(true);

      const [x0, y0, x1, y1] = block.dbox;
      const z = meta.z;
      const leftPx = x0 * z;
      const topPx = y0 * z;
      const origWidthPx = Math.max(40, (x1 - x0) * z);
      const maxColWidthPx = Math.max(origWidthPx, (block.max_w || (x1 - x0)) * z);
      // Single-line headings/labels can expand to column width; multi-line paragraphs wrap at their exact width
      const editorWidthPx = (block.lines_count > 1 || origWidthPx > 220 * z)
        ? origWidthPx + 8
        : Math.min(maxColWidthPx, origWidthPx + 140);

      const fontSizePx = (block.size || 11) * z;
      const lineHeightPx = (block.line_height || (block.size * 1.28)) * z;
      const isBold = Boolean((block.flags & 16) || /bold|black|heavy|semibold/i.test(block.font || ""));
      const isItalic = Boolean((block.flags & 2) || /italic|oblique/i.test(block.font || ""));

      const ta = document.createElement("textarea");
      ta.className = "wysiwyg-editor";
      ta.value = block.text;
      ta.style.left = leftPx + "px";
      ta.style.top = topPx + "px";
      ta.style.width = editorWidthPx + "px";
      ta.style.minHeight = Math.max(fontSizePx * 1.35, (y1 - y0) * z + 4) + "px";
      ta.style.fontSize = fontSizePx + "px";
      ta.style.lineHeight = lineHeightPx + "px";
      ta.style.fontFamily = cssFontFamily(block.font, block.flags || 0);
      ta.style.fontWeight = isBold ? "700" : "400";
      ta.style.fontStyle = isItalic ? "italic" : "normal";
      ta.style.color = intToHexColor(block.color);
      ta.style.textAlign = block.align === "justify" ? "justify" : (block.align || "left");

      const hint = document.createElement("div");
      hint.className = "editor-hint";
      hint.style.left = leftPx + "px";
      hint.style.top = Math.max(0, topPx - 24) + "px";
      hint.textContent = "Ctrl+Enter or click outside to apply • Esc to cancel";

      const autoSize = () => {
        ta.style.height = "auto";
        ta.style.height = Math.max((y1 - y0) * z + 4, ta.scrollHeight) + "px";
      };

      ta.addEventListener("input", autoSize);
      ta.addEventListener("click", (e) => e.stopPropagation());
      ta.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          closeActiveEditor(false);
        } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey || (block.lines_count === 1 && !e.shiftKey))) {
          e.preventDefault();
          closeActiveEditor(true);
        }
      });

      wrap.appendChild(ta);
      wrap.appendChild(hint);
      autoSize();
      ta.focus();

      activeEditor = { textarea: ta, hintEl: hint, pageIdx, block };
    }

    async function submitLineEdit(pageIdx, block, newText) {
      setStatus("Applying edit...");
      const res = await fetch("/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: "line",
          page: pageIdx,
          block_id: block.id,
          bbox: block.bbox,
          old: block.text,
          new: newText,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.detail || data.error || "Edit failed");
        setStatus("Edit failed.");
        return;
      }
      await refreshPage(pageIdx);
      setStatus(data.missing ? `Applied (fallback font used for: ${data.missing})` : "Edit applied.");
    }

    function setupPageInteractions(wrap, pageIdx, meta) {
      let dragStart = null;
      let coverEl = null;

      wrap.addEventListener("mousedown", (e) => {
        if (e.target.tagName === "TEXTAREA") return;
        if (activeEditor) {
          closeActiveEditor(true);
          return;
        }
        const rect = wrap.getBoundingClientRect();
        const x = (e.clientX - rect.left) / meta.z;
        const y = (e.clientY - rect.top) / meta.z;

        if (currentMode === "add") {
          const text = prompt("Enter text to insert:");
          if (text && text.trim()) {
            fetch("/edit", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                type: "add",
                page: pageIdx,
                x,
                y,
                text,
                family: "sans",
                size: 11,
                bold: false,
                italic: false,
                color: 0,
              }),
            }).then(() => refreshPage(pageIdx));
          }
          return;
        }

        if (currentMode === "cover") {
          dragStart = { x, y, pxX: e.clientX - rect.left, pxY: e.clientY - rect.top };
          coverEl = document.createElement("div");
          coverEl.className = "cover-rect";
          wrap.appendChild(coverEl);
        }
      });

      wrap.addEventListener("mousemove", (e) => {
        if (!dragStart || !coverEl) return;
        const rect = wrap.getBoundingClientRect();
        const curPxX = e.clientX - rect.left;
        const curPxY = e.clientY - rect.top;
        coverEl.style.left = Math.min(dragStart.pxX, curPxX) + "px";
        coverEl.style.top = Math.min(dragStart.pxY, curPxY) + "px";
        coverEl.style.width = Math.abs(curPxX - dragStart.pxX) + "px";
        coverEl.style.height = Math.abs(curPxY - dragStart.pxY) + "px";
      });

      window.addEventListener("mouseup", async (e) => {
        if (!dragStart || !coverEl) return;
        const rect = wrap.getBoundingClientRect();
        const endX = (e.clientX - rect.left) / meta.z;
        const endY = (e.clientY - rect.top) / meta.z;
        const r = [
          Math.min(dragStart.x, endX),
          Math.min(dragStart.y, endY),
          Math.max(dragStart.x, endX),
          Math.max(dragStart.y, endY),
        ];
        coverEl.remove();
        dragStart = null;
        coverEl = null;

        if (r[2] - r[0] > 2 && r[3] - r[1] > 2) {
          setStatus("Erasing area...");
          await fetch("/edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: "cover", page: pageIdx, rect: r }),
          });
          await refreshPage(pageIdx);
          setStatus("Area erased.");
        }
      });
    }

    btnUndo.addEventListener("click", async () => {
      closeActiveEditor(false);
      const res = await fetch("/undo", { method: "POST" });
      if (!res.ok) {
        setStatus("Nothing to undo.");
        return;
      }
      pagesMeta.forEach((_, idx) => refreshPage(idx));
      setStatus("Undid last change.");
    });

    btnSave.addEventListener("click", () => {
      closeActiveEditor(true);
      window.location.href = "/save";
    });
  </script>
</body>
</html>
